<title>Moonlight Mart</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Caveat:wght@500;700&family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap">
<style>
/* Layout: one narrow column (max 560px) under a navy shop-sign header; receipts, price tags and sticky notes are the props. */
:root {
  --night: #1B2238;      /* sign band, always night */
  --neon: #3FE0B0;       /* neon mint on the sign */
  --tag: #FFD23F;        /* price-tag yellow */
  --ramen: #E2442F;      /* error, ramen packet */
  --paper: #EDEBE4;      /* receipt paper (same in both themes) */
  --print: #2B2B2B;      /* receipt ink */
  --milk: #F6E7A1;       /* banana-milk sticky notes */

  --bg: #F4F7F2;         /* fluorescent white */
  --surface: #FFFFFF;
  --surface-2: #E9EEEA;
  --ink: #23262B;
  --muted: #5B6573;
  --line: #CDD5D1;
  --accent: #077556;     /* mint, darkened for light backgrounds (≥ 4.5:1 on white and on the page background) */
  --accent-ink: #FFFFFF;
  --ok: #077556;
  --ok-bg: #DDF5EC;
  --bad: #C2341F;
  --bad-bg: #FBE3DE;
  --focus: #1F6FEB;

  --f-display: 'Black Han Sans', 'Noto Sans KR', system-ui, sans-serif;
  --f-ko: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --f-ui: 'IBM Plex Sans', 'Noto Sans KR', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --f-hand: 'Caveat', 'Comic Sans MS', cursive;
  --hdr-h: 58px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141A2C; --surface: #1E2640; --surface-2: #262F4D; --ink: #EEF2EC; --muted: #A2ADC2; --line: #34405F;
    --accent: #3FE0B0; --accent-ink: #10172A; --ok: #3FE0B0; --ok-bg: #173A3A; --bad: #FF7A63; --bad-bg: #3D2230; --focus: #8AB4FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141A2C; --surface: #1E2640; --surface-2: #262F4D; --ink: #EEF2EC; --muted: #A2ADC2; --line: #34405F;
  --accent: #3FE0B0; --accent-ink: #10172A; --ok: #3FE0B0; --ok-bg: #173A3A; --bad: #FF7A63; --bad-bg: #3D2230; --focus: #8AB4FF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body.kbd-open { padding-bottom: 260px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.ko { font-family: var(--f-ko); }
.ko-in { font-family: var(--f-ko); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.err { color: var(--bad); }

/* ---------- header: the shop sign ---------- */
#hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--night); color: #F4F7F2; border-bottom: 3px solid var(--neon); }
.hdr-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px; min-height: var(--hdr-h);
  padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sign { display: flex; flex-direction: column; line-height: 1; min-width: 0; }
.sign-ko { font-family: var(--f-display); font-size: 1.55rem; color: var(--neon); letter-spacing: 0.02em;
  text-shadow: 0 0 6px rgba(63, 224, 176, 0.55), 0 0 18px rgba(63, 224, 176, 0.35); animation: flicker 9s infinite; }
.sign-en { font-family: var(--f-mono); font-size: 0.62rem; letter-spacing: 0.3em; text-transform: uppercase; color: #9FB0CF; margin-top: 3px; }
.sign { position: relative; }
.sign-date { font-size: 0.72rem; color: #9FB0CF; margin-top: 3px; white-space: nowrap; cursor: default; -webkit-tap-highlight-color: transparent; user-select: none; }
.date-pop { position: absolute; top: calc(100% + 10px); left: 0; z-index: 50; white-space: nowrap; background: var(--night); color: #F4F7F2; padding: 6px 10px; border-radius: 6px; font-size: 0.92rem; line-height: 1.3;
  box-shadow: 0 6px 16px -6px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.16); animation: glIn 0.12s ease-out; }
.date-pop::before { content: ''; position: absolute; top: -6px; left: 18px; border: 6px solid transparent; border-top: 0; border-bottom-color: var(--night); }
@keyframes flicker { 0%, 91%, 93%, 96%, 100% { opacity: 1; } 92%, 95% { opacity: 0.45; } }
.hdr-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.clock { font-family: var(--f-mono); font-size: 1rem; color: var(--neon); font-variant-numeric: tabular-nums; }
.clock .colon { animation: blink 2s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0.2; } }
.tag-price { font-family: var(--f-mono); font-weight: 600; font-size: 0.82rem; background: var(--tag); color: var(--print); padding: 3px 8px 3px 12px;
  clip-path: polygon(8px 0, 100% 0, 100% 100%, 8px 100%, 0 50%); font-variant-numeric: tabular-nums; white-space: nowrap; }
.theme-btn { background: transparent; border: 1px solid #3A4668; color: #F4F7F2; width: 34px; height: 34px; border-radius: 50%; font-size: 1rem; }
.hdr-back { background: var(--ramen); color: #fff; border: 0; border-radius: 4px; padding: 6px 10px; font-size: 0.82rem; font-weight: 600; white-space: nowrap; }
.hdr-back.armed { background: var(--tag); color: var(--print); }
body.in-round .sign-en, body.in-round .sign-date, body.in-round .date-pop { display: none; }
@media (max-width: 420px) { body.in-round .sign { display: none; } }

/* ---------- lesson bar + tabs ---------- */
#lbar { max-width: 560px; margin: 0 auto; padding-top: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body.in-round #lbar { display: none; }
.lbar-in { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.lsel select { font-family: var(--f-ko); font-weight: 700; font-size: 1rem; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.lsub { color: var(--muted); font-size: 0.9rem; }
.tabs { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 6px; margin-top: 12px; border-bottom: 2px solid var(--line); }
.tab { background: transparent; border: 0; border-bottom: 3px solid transparent; margin-bottom: -2px; padding: 8px 4px 9px; font-weight: 600; font-size: 0.92rem; color: var(--muted);
  display: flex; align-items: center; justify-content: center; gap: 6px; }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.st { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--muted); flex: none; }
.st-wip { border-color: var(--tag); background: linear-gradient(90deg, var(--tag) 50%, transparent 50%); }
.st-done { border-color: var(--accent); background: var(--accent); }

main#main { max-width: 560px; margin: 0 auto; padding-block: 16px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1.5px solid var(--ink); background: var(--surface); color: var(--ink);
  border-radius: 6px; padding: 10px 16px; font-weight: 600; min-height: 44px; }
.btn-go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); width: 100%; margin-top: 14px; font-size: 1.02rem; }
.btn-ghost { background: transparent; border-color: var(--line); width: 100%; margin-top: 10px; }
.btn-sm { min-height: 38px; padding: 6px 12px; font-size: 0.9rem; }
.btn.danger, .btn-ghost.danger { border-color: var(--bad); color: var(--bad); }
.btn-go.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn:disabled { opacity: 0.45; }
.link { background: none; border: 0; padding: 4px 2px; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; font-size: 0.9rem; }
.link:disabled { color: var(--muted); text-decoration: none; }
.chip { display: inline-block; font-family: var(--f-mono); font-size: 0.72rem; padding: 1px 7px; border-radius: 3px; vertical-align: middle; }
.chip-ok { background: var(--ok-bg); color: var(--ok); }
.chip-rev { background: var(--milk); color: var(--print); }
.chip-weak { background: var(--bad-bg); color: var(--bad); }
.tag { font-family: var(--f-mono); font-size: 0.7rem; font-weight: 600; padding: 2px 6px; border-radius: 3px; letter-spacing: 0.04em; }
.tag-red { background: var(--ramen); color: #fff; }
.eyebrow { font-family: var(--f-mono); font-size: 0.74rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
.lbl { font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* ---------- lesson-audio player ---------- */
.player { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hdr-h) + 3px); z-index: 30; display: flex; gap: 12px; align-items: center;
  background: var(--night); color: #F4F7F2; border-radius: 10px; padding: 10px 12px; box-shadow: 0 6px 18px rgba(16, 23, 42, 0.25); }
.pl-play { width: 48px; height: 48px; flex: none; border-radius: 50%; border: 0; background: var(--neon); color: var(--night); font-size: 1.1rem; font-weight: 700; }
.pl-mid { flex: 1; min-width: 0; }
.pl-title { font-size: 0.8rem; color: #C9D3E6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-mid input[type=range] { width: 100%; accent-color: var(--neon); margin: 4px 0 2px; }
.pl-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
.pl-time { font-family: var(--f-mono); font-size: 0.78rem; font-variant-numeric: tabular-nums; }
.pl-btns { display: flex; gap: 4px; flex-wrap: wrap; }
.pl-btns button { background: transparent; border: 1px solid #3A4668; color: #F4F7F2; border-radius: 4px; padding: 2px 7px; font-family: var(--f-mono); font-size: 0.74rem; min-height: 28px; }
.pl-btns button.on { background: var(--neon); color: var(--night); border-color: var(--neon); }
.pl-rate { display: inline-flex; gap: 4px; }

/* ---------- textbook ---------- */
.mode-bar { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 6px; gap: 10px; }
.seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 6px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 7px 16px; font-weight: 600; min-height: 38px; }
.seg button.on { background: var(--ink); color: var(--bg); }
.mode-count { font-family: var(--f-mono); font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.mode-help { font-size: 0.88rem; color: var(--muted); margin: 4px 0 0; }
.tb-h { margin: 22px 0 8px; }
.tb-title { margin: 0; display: flex; flex-direction: column; gap: 2px; text-wrap: balance; }
.tb-title .ko { font-family: var(--f-display); font-weight: 400; font-size: 2.6rem; line-height: 1.1; }
.tb-sub { font-size: 1.05rem; color: var(--muted); font-weight: 600; }
.tb-h2 { font-family: var(--f-ui); font-size: 0.82rem; letter-spacing: 0.16em; text-transform: uppercase; margin: 30px 0 8px; padding-bottom: 6px; border-bottom: 1px dashed var(--line); }
.tb-p { margin: 10px 0; max-width: 65ch; }
.meaning { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 6px; margin: 12px 0; }
.meaning .lbl { flex-basis: 100%; }
.meaning-ko { font-size: 1.5rem; font-weight: 700; }
.meaning-en { font-weight: 600; }
.trk { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1.5px dashed var(--accent); color: var(--accent); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 0.86rem; margin: 6px 0; min-height: 38px; }
.trk-ic { font-size: 0.75rem; }
.trk.playing { background: var(--accent); color: var(--accent-ink); border-style: solid; }
.trk.playing .trk-ic { animation: blink 1s steps(1) infinite; }
.sent { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.sent-body { flex: 1; min-width: 0; }
.sent-ko { font-size: 1.38rem; font-weight: 500; margin: 0; line-height: 1.6; overflow-wrap: anywhere; }
.sent-en { margin: 2px 0 0; color: var(--muted); }
.sent-hint { margin: 2px 0 0; color: var(--muted); font-size: 0.92rem; }
.sent .tr { font-size: 0.78rem; padding: 0 2px; }
.sp { font-family: var(--f-mono); font-weight: 600; background: var(--surface-2); border-radius: 4px; width: 26px; height: 26px; display: inline-grid; place-items: center; flex: none; margin-top: 6px; }
input.gap { font-family: var(--f-ko); font-size: 1.2rem; border: 0; border-bottom: 2px dashed var(--accent); background: var(--ok-bg); color: var(--ink); padding: 0 4px; border-radius: 3px 3px 0 0; max-width: 100%; }
input.gap:focus { outline: none; border-bottom-style: solid; background: var(--surface); box-shadow: 0 2px 0 var(--accent); }
mark.gap-done { background: transparent; color: inherit; border-bottom: 2px solid var(--accent); }
mark.gap-done.rev { border-bottom-color: var(--tag); }
.gap-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.gap-fb { font-size: 0.86rem; color: var(--bad); }
.shake { animation: shake 0.35s; border-bottom-color: var(--bad) !important; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.ex { margin: 6px 0 6px; padding-left: 12px; border-left: 2px solid var(--line); }
.ex > .lbl { display: block; margin-top: 8px; }
.dialogue { margin: 6px 0; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.dialogue .sent:last-child { border-bottom: 0; }
.exs { margin-top: 10px; }
.exq { padding: 12px 0; border-bottom: 1px solid var(--line); }
.exq-q, .wbq-q { margin: 0 0 8px; }
.num { font-family: var(--f-mono); font-weight: 600; color: var(--muted); }
.exq-done { margin: 0; font-size: 1.12rem; }
.exq-done .ko { font-weight: 600; }
.type-row { display: flex; gap: 8px; }
.type-row input { flex: 1; min-width: 0; font-size: 1.15rem; padding: 9px 10px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
.type-row input:focus { border-color: var(--accent); outline: none; }
.type-row .btn { width: auto; margin-top: 0; flex: 0 0 auto; padding-inline: 16px; } /* a full-width .btn-go (Scan) used to squeeze the answer field to nothing */
.ex-fb { font-size: 0.9rem; color: var(--bad); margin-top: 6px; }
.src-note { font-family: var(--f-mono); font-size: 0.74rem; color: var(--muted); }
.rcpt .src-note { color: #5E5A50; } /* the receipt is paper-coloured in both themes */
.sticky-note { font-family: var(--f-hand); font-size: 1.35rem; line-height: 1.3; background: var(--milk); color: var(--print); padding: 14px 16px; margin: 16px 6px; transform: rotate(-1.2deg);
  box-shadow: 0 8px 14px -8px rgba(0, 0, 0, 0.35); max-width: 46ch; }
.sticky-note .ko-in { font-family: var(--f-ko); font-size: 1rem; }
.sticky-note b { font-weight: 700; }

/* ---------- workbook ---------- */
.wb-sec { margin-bottom: 8px; }
.wb-task { color: var(--muted); margin: 0 0 10px; }
.wb-example { background: var(--surface); border: 1px dashed var(--line); padding: 10px 12px; border-radius: 6px; margin-bottom: 8px; }
.wbq { padding: 12px 0; border-bottom: 1px solid var(--line); }
.wbq-q .ko { font-size: 1.2rem; font-weight: 600; }
.vocab-done { list-style: none; padding: 0; margin: 0 0 10px; display: grid; gap: 4px; }
.vocab-done li { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; padding: 4px 0; border-bottom: 1px dotted var(--line); }
.vocab-done .ko { font-weight: 600; min-width: 5.5em; }
.vocab-done .en { color: var(--muted); }
.keynote { font-size: 0.78rem; color: var(--muted); font-style: italic; }
.round-lbl { font-size: 0.88rem; color: var(--muted); margin: 6px 0; }
.dict-ctl { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.trk-slow { border-color: var(--muted); color: var(--muted); }
.diff { font-size: 1.2rem; margin: 4px 0; }
.diff ins, .diff-legend ins { background: var(--ok-bg); color: var(--ok); text-decoration: none; border-bottom: 2px solid var(--ok); }
.diff del, .diff-legend del { background: var(--bad-bg); color: var(--bad); }
.diff-legend { color: var(--muted); font-size: 0.82rem; margin: 0; }

/* ---------- match ---------- */
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.match-col { display: grid; gap: 8px; align-content: start; }
.mt { background: var(--surface); border: 1.5px solid var(--line); border-radius: 6px; padding: 10px 8px; min-height: 48px; font-size: 0.92rem; text-align: center; overflow-wrap: anywhere; }
.mt.ko { font-size: 1.1rem; font-weight: 600; }
.mt.sel { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.mt.is-ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.mt.is-bad { background: var(--bad-bg); border-color: var(--bad); }

/* ---------- receipts ---------- */
.rcpt { position: relative; background: var(--paper); color: var(--print); font-family: var(--f-mono); padding: 16px 16px 22px; margin: 16px 0 6px;
  box-shadow: 0 10px 20px -14px rgba(0, 0, 0, 0.5);
  -webkit-mask: linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom/16px 8px repeat-x;
  mask: linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom/16px 8px repeat-x; }
.rcpt .ko { font-family: var(--f-ko); }
.rcpt-head { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; font-size: 0.86rem; border-bottom: 1px dashed #9A968A; padding-bottom: 8px; margin-bottom: 8px; letter-spacing: 0.05em; }
.rcpt-mark { font-weight: 700; }
.rcpt.ok .rcpt-mark { color: #0A7457; font-size: 1.1rem; }
.rcpt.bad .rcpt-mark { color: #B32A16; font-size: 1.1rem; letter-spacing: 0.12em; }
.rcpt.ok::after { content: ''; position: absolute; right: 14px; bottom: 50px; width: 54px; height: 54px; border: 3px solid rgba(10, 116, 87, 0.55); border-radius: 50%; transform: rotate(-14deg);
  background: radial-gradient(circle, transparent 52%, rgba(10, 116, 87, 0.12) 53%); }
.rcpt-won { color: #0A7457; font-size: 1.05rem; }
.rcpt-quip { font-family: var(--f-ui); font-style: italic; margin: 6px 0; font-size: 0.92rem; padding-right: 60px; }
.rcpt-note { font-family: var(--f-ui); background: #F7E8A4; padding: 6px 8px; margin: 8px 0; font-size: 0.9rem; }
.rcpt-line { margin: 6px 0; font-size: 0.92rem; overflow-wrap: anywhere; }
.rcpt-line b.ko { font-size: 1.15rem; }
.rcpt-explain { font-family: var(--f-ui); font-size: 0.92rem; margin: 8px 0 0; border-top: 1px dashed #9A968A; padding-top: 8px; }
.rcpt-rows p { display: flex; justify-content: space-between; gap: 12px; margin: 4px 0; font-size: 0.88rem; }
.rcpt-rows p b { font-variant-numeric: tabular-nums; text-align: right; }
.rcpt-rows p.total { border-top: 1px dashed #9A968A; padding-top: 6px; font-weight: 700; }
.barcode { margin-top: 12px; height: 26px; }
.barcode svg { display: block; fill: var(--print); }
.summary { margin-top: 30px; }

/* ---------- question ---------- */
.q-prompt { font-weight: 600; margin: 14px 0 8px; font-size: 1.02rem; text-wrap: pretty; }
.q-ko { font-size: 1.5rem; margin: 6px 0 12px; line-height: 1.5; }
.blank { display: inline-block; min-width: 3.2em; border-bottom: 3px solid var(--accent); }
.q-opts { display: grid; gap: 8px; }
.ko-opts { grid-template-columns: 1fr 1fr; }
.opt { background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 12px 12px; min-height: 52px; text-align: left; font-size: 0.98rem; overflow-wrap: anywhere; }
.opt.ko { font-size: 1.22rem; text-align: center; }
.opt:not(:disabled):hover { border-color: var(--accent); }
.opt.is-ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.opt.is-bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); text-decoration: line-through; }
.q-tools { display: flex; justify-content: space-between; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
.q-hinttext { font-size: 0.9rem; color: var(--muted); margin: 4px 0; }
.tray { min-height: 58px; border: 2px dashed var(--line); border-radius: 8px; padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--surface); }
.tray-units { gap: 2px; }
.tray-empty { color: var(--muted); font-size: 0.88rem; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.tile { background: var(--tag); color: var(--print); border: 0; border-radius: 4px; padding: 8px 12px; font-size: 1.18rem; font-weight: 600; min-height: 44px; min-width: 44px;
  box-shadow: 0 3px 0 #C79E10; }
.tile:disabled { opacity: 0.22; box-shadow: none; }
.tile.placed { background: var(--surface-2); color: var(--ink); box-shadow: 0 2px 0 var(--line); }
.q-fb { margin-top: 6px; }

/* ---------- game home ---------- */
.counter { background: var(--night); color: #F4F7F2; border-radius: 10px; padding: 18px 16px; position: relative; overflow: hidden; }
.counter::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 4px; background: repeating-linear-gradient(90deg, var(--neon) 0 22px, transparent 22px 30px); opacity: 0.8; }
.counter .eyebrow { color: #9FB0CF; }
.counter-t { font-family: var(--f-ui); font-size: 1.32rem; margin: 2px 0 6px; text-wrap: balance; }
.counter-sub { color: #C9D3E6; margin: 0; font-size: 0.92rem; }
.counter .btn-go { background: var(--neon); border-color: var(--neon); color: var(--night); }
.sec-h { font-size: 0.8rem; letter-spacing: 0.16em; text-transform: uppercase; margin: 26px 0 10px; color: var(--muted); }
.shifts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.shift-card { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 10px 12px; min-width: 0; }
.shift-k { font-family: var(--f-display); font-size: 1.8rem; line-height: 1; color: var(--accent); }
.shift-t { font-weight: 700; font-size: 0.92rem; line-height: 1.25; }
.shift-s { font-size: 0.76rem; color: var(--muted); }
.shift-st { margin-top: 6px; font-family: var(--f-mono); font-size: 0.7rem; color: var(--muted); }
.shift-card.done { border-color: var(--accent); }
.shift-card.done .shift-st { color: var(--ok); }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.act { display: flex; flex-direction: column; align-items: flex-start; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
.act:disabled { opacity: 0.5; }
.act-t { font-weight: 700; }
.act-s { font-size: 0.8rem; color: var(--muted); }
.timecard { margin-top: 26px; background: var(--paper); color: var(--print); border-radius: 4px; padding: 12px; font-family: var(--f-mono); }
.tc-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 0.76rem; font-weight: 600; letter-spacing: 0.04em; border-bottom: 1px solid #B8B4A8; padding-bottom: 6px; }
.tc-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
.tc-cell { position: relative; aspect-ratio: 1; max-width: 100%; border: 1px solid #C9C5B9; display: grid; place-items: start; padding: 2px 4px; font-size: 0.68rem; color: #5E5A50; }
.tc-cell.today { border-color: var(--print); border-width: 2px; }
.stamp { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-ko); font-weight: 900; color: #C2341F; font-size: 0.8rem; transform: rotate(-12deg);
  border: 2px solid #C2341F; border-radius: 50%; margin: 3px; opacity: 0.85; }
.expiry { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.expiry li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; font-size: 0.9rem; flex-wrap: wrap; }
.expiry li.due { border-color: var(--bad); }
.ex-date { font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); }
.expiry li.due .ex-date { color: var(--bad); font-weight: 600; }
.coll { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.prod { display: flex; flex-direction: column; gap: 2px; background: var(--surface); border: 1.5px solid var(--line); border-top: 6px solid var(--ramen); border-radius: 6px; padding: 8px; min-height: 92px; }
.prod:nth-child(3n+2) { border-top-color: var(--tag); }
.prod:nth-child(3n) { border-top-color: var(--neon); }
.prod.missing { border-style: dashed; border-top-width: 1.5px; background: transparent; }
.prod.missing .prod-ko, .prod.missing .prod-en, .prod.missing .prod-ltd { color: var(--muted); font-weight: 400; } /* was opacity 0.6: text fell below readable contrast */
.prod-ltd { font-family: var(--f-mono); font-size: 0.62rem; letter-spacing: 0.14em; color: var(--muted); }
.prod-ko { font-weight: 700; font-size: 0.98rem; line-height: 1.3; }
.prod-en { font-size: 0.74rem; color: var(--muted); }
.data-box { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.data-box p { margin: 0 0 8px; }
.data-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.data-btns .btn { margin-top: 0; font-size: 0.82rem; padding: 6px; }
textarea.code { width: 100%; font-family: var(--f-mono); font-size: 0.78rem; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin: 6px 0; overflow-wrap: anywhere; }
#dataPanel { margin: 10px 0; }

/* ---------- round / scene ---------- */
.round-head { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 0.8rem; font-weight: 600; letter-spacing: 0.08em; }
.round-p { font-variant-numeric: tabular-nums; color: var(--muted); }
.round-bar { height: 4px; background: var(--surface-2); border-radius: 2px; margin: 8px 0; overflow: hidden; }
.round-bar span { display: block; height: 100%; background: var(--accent); transition: width 0.3s; }
.round-sub { font-size: 0.86rem; color: var(--muted); margin: 0; }
.phase { text-align: left; }
.phases { list-style: none; padding: 0; display: flex; gap: 4px; margin: 6px 0 18px; flex-wrap: wrap; }
.phases li { font-family: var(--f-mono); font-size: 0.72rem; padding: 4px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
.phases li.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.phases li.past { text-decoration: line-through; }
.phase-t { font-family: var(--f-display); font-weight: 400; font-size: 2.2rem; margin: 0; line-height: 1.1; }
.phase-d { color: var(--muted); max-width: 52ch; }
.scene-top { display: flex; gap: 10px; align-items: baseline; font-family: var(--f-mono); }
.sc-time { font-size: 1.5rem; color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
.sc-place { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.sc-prog { margin-left: auto; font-size: 0.8rem; color: var(--muted); }
.narr { font-style: italic; color: var(--muted); margin: 10px 0; max-width: 60ch; }
.lines { display: grid; gap: 10px; margin: 12px 0; }
.line { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; }
.line .who { font-size: 0.8rem; font-weight: 700; padding: 4px 8px; border-radius: 4px; background: var(--surface-2); white-space: nowrap; margin-top: 4px; }
.line.me { grid-template-columns: 1fr auto; }
.line.me .who { order: 2; background: var(--accent); color: var(--accent-ink); }
.line.me .bubble { order: 1; border-color: var(--accent); }
.bubble { background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 0; }
.bubble .ko { font-size: 1.3rem; margin: 0; line-height: 1.5; overflow-wrap: anywhere; }
.bubble .en { margin: 2px 0 0; color: var(--muted); font-size: 0.92rem; }
.bubble .trb { font-size: 0.76rem; padding: 0; }
.who-boss .who { background: var(--tag); color: var(--print); }
.who-manager .who, .who-hq .who { background: var(--ramen); color: #fff; }
.who-grandma .who { background: var(--paper); color: var(--print); }
.who-sua .who { background: var(--milk); color: var(--print); }
.who-taxi .who, .who-courier .who, .who-police .who { background: var(--night); color: #F4F7F2; }
.after { margin-top: 12px; }
.sticky-note.boss { margin-bottom: 18px; }

/* ---------- rush ---------- */
.rush-head { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.rush-clock { font-family: var(--f-mono); font-size: 2.4rem; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1; }
.rush-clock.low { color: var(--bad); animation: blink 1s steps(1) infinite; }
.rush-lbl { font-family: var(--f-mono); color: var(--muted); }
.queue { margin-left: auto; display: flex; gap: 3px; flex-wrap: wrap; }
.cust { width: 12px; height: 18px; border-radius: 6px 6px 2px 2px; background: var(--muted); opacity: 0.6; }
.cust.now { background: var(--tag); opacity: 1; }
.cust.gone { opacity: 0.12; }

/* ---------- floor plan ---------- */
.floor { width: 100%; max-width: 100%; height: auto; display: block; margin: 10px 0; }
.fl-wall { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
.fl-shelf { fill: var(--surface-2); stroke: var(--line); }
.fl-back { stroke-dasharray: 6 3; }
.fl-shelf.ramen { fill: var(--ramen); opacity: 0.35; }
.fl-cat { fill: #E9A23B; }
.fl-counter { fill: var(--surface-2); stroke: var(--ink); }
.fl-door { fill: var(--accent); }
.fl-lbl { font-family: var(--f-mono); font-size: 8px; fill: var(--muted); }
.up rect { stroke-width: 1.5; cursor: pointer; }
.up text { font-family: var(--f-mono); font-size: 9px; font-weight: 700; pointer-events: none; }
.up-broken rect { fill: var(--bad-bg); stroke: var(--bad); }
.up-broken text { fill: var(--bad); }
.up-fixed rect { fill: var(--ok-bg); stroke: var(--ok); }
.up-fixed text { fill: var(--ok); }
.up-locked rect { fill: var(--surface-2); stroke: var(--line); stroke-dasharray: 3 2; }
.up-locked text { fill: var(--muted); }
.up.hl rect { stroke-width: 3; animation: blink 0.8s steps(1) infinite; }
.legend { list-style: none; padding: 0; display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); margin: 0; }
.lg { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.lg-broken { background: var(--bad); } .lg-fixed { background: var(--ok); } .lg-locked { background: var(--line); }
.up-info { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-top: 10px; }

/* ---------- snack ---------- */
.snack { display: flex; gap: 14px; align-items: center; margin: 18px 0 6px; flex-wrap: wrap; }
.snack-box { display: flex; flex-direction: column; gap: 4px; width: 150px; padding: 14px 12px; background: var(--ramen); color: #fff; border-radius: 8px 8px 4px 4px; transform: rotate(-3deg);
  box-shadow: 0 10px 18px -10px rgba(0, 0, 0, 0.6); border-top: 10px solid var(--tag); }
.snack-box .prod-ltd { color: var(--tag); }
.snack-ko { font-size: 1.12rem; font-weight: 900; line-height: 1.25; }
.snack-en { font-size: 0.74rem; opacity: 0.9; }
.snack-desc { flex: 1; min-width: 160px; font-style: italic; color: var(--muted); margin: 0; }

/* ---------- flashcards ---------- */
.flash { display: grid; place-items: center; gap: 8px; width: 100%; min-height: 220px; margin: 14px 0; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 20px;
  box-shadow: 0 2px 0 var(--line), 0 12px 24px -16px rgba(0, 0, 0, 0.4); background-image: linear-gradient(90deg, transparent 0 16px, var(--tag) 16px 22px, transparent 22px); }
.flash-front { font-size: 1.6rem; font-weight: 700; text-align: center; overflow-wrap: anywhere; }
.flash-front:not(.ko) { font-size: 1.2rem; }
.flash-hint { font-family: var(--f-mono); font-size: 0.74rem; color: var(--muted); }
.flash-back { display: grid; gap: 4px; text-align: center; border-top: 1px dashed var(--line); padding-top: 10px; width: 100%; font-size: 1.15rem; }
.flash-back[hidden] { display: none; }
.flash-back .ko { font-size: 1.4rem; font-weight: 600; }
.flash-src { font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); }
.grade3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.grade3[hidden] { display: none; }
.g3-1 { border-color: var(--bad); color: var(--bad); } .g3-2 { border-color: #B98A00; color: #B98A00; } .g3-3 { border-color: var(--ok); color: var(--ok); }

/* ---------- reader ---------- */
.reader-t { font-size: 1.6rem; margin: 0 0 10px; }
.rlines { display: grid; gap: 10px; }
.chat .rline { background: var(--surface); border: 1px solid var(--line); border-radius: 12px 12px 12px 3px; padding: 8px 12px; max-width: 88%; }
.chat .rline.from-boss { margin-left: auto; border-radius: 12px 12px 3px 12px; background: var(--ok-bg); border-color: transparent; }
.chat .rline .who { font-size: 0.74rem; font-weight: 700; color: var(--muted); }
.rline p { margin: 0; }
.rline p.ko { font-size: 1.22rem; line-height: 1.55; }
.rline p.en { color: var(--muted); font-size: 0.9rem; }
.board .rlines { background: var(--paper); color: var(--print); padding: 18px 16px; border-radius: 2px; transform: rotate(0.6deg); box-shadow: 0 10px 20px -12px rgba(0, 0, 0, 0.5); gap: 6px; }
.board .rline p.en { color: #5E5A50; }
.board-h { font-family: var(--f-display); font-weight: 400; font-size: 1.6rem; color: var(--ramen); margin: 0 0 10px; }
.gl { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-decoration: underline dotted 2px; text-decoration-color: var(--accent); text-underline-offset: 4px; }
.reader { position: relative; }
.gl.gl-on { background: color-mix(in srgb, var(--accent) 18%, transparent); border-radius: 3px; }
.gl-pop { position: absolute; z-index: 20; max-width: min(280px, 100%); background: var(--night); color: #F4F7F2; padding: 6px 10px; border-radius: 6px; font-size: 0.92rem; line-height: 1.35; box-shadow: 0 6px 16px -6px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.14); pointer-events: none; animation: glIn 0.12s ease-out; }
.gl-pop::before { content: ''; position: absolute; top: -6px; left: calc(var(--ax, 20px) - 6px); border: 6px solid transparent; border-top: 0; border-bottom-color: var(--night); }
.gl-lemma { font-weight: 700; margin-right: 4px; }
@keyframes glIn { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }

/* ---------- on-screen keyboard ---------- */
.kbd { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; background: var(--night); border-top: 3px solid var(--neon);
  padding-top: 6px; padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px)); }
.kbd-top { max-width: 560px; margin: 0 auto 4px; display: flex; align-items: center; gap: 8px; color: #9FB0CF; font-family: var(--f-mono); font-size: 0.72rem; }
.kbd-sys { margin-left: auto; background: none; border: 1px solid #3A4668; color: #C9D3E6; border-radius: 4px; padding: 3px 8px; font-size: 0.72rem; }
.kbd-hide { background: none; border: 1px solid #3A4668; color: #C9D3E6; border-radius: 4px; width: 34px; height: 26px; }
.kbd-row { max-width: 560px; margin: 0 auto 5px; display: flex; gap: 4px; justify-content: center; }
.key { flex: 1; min-width: 0; height: 44px; border: 0; border-radius: 5px; background: #F4F7F2; color: #1B2238; font-family: var(--f-ko); font-size: 1.15rem; font-weight: 500; box-shadow: 0 2px 0 #0B1020; }
.key:active { background: var(--neon); }
.key-fn { background: #3A4668; color: #F4F7F2; font-family: var(--f-mono); font-size: 0.95rem; flex: 1.3; }
.key-fn.on { background: var(--tag); color: var(--print); }
.key-space { flex: 4; font-family: var(--f-mono); font-size: 0.8rem; color: #5B6573; }
.key-enter { flex: 2.6; background: var(--neon); color: #1B2238; font-family: var(--f-mono); font-size: 0.82rem; font-weight: 700; }

#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; transition: 0.25s; z-index: 80;
  background: var(--night); color: #F4F7F2; border: 1px solid var(--neon); padding: 10px 14px; border-radius: 6px; font-size: 0.9rem; max-width: calc(100vw - 32px); pointer-events: none; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
body.kbd-open #toast { bottom: 280px; }

@media (max-width: 420px) {
  .shifts { grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .shift-t { font-size: 0.82rem; }
  .data-btns { grid-template-columns: 1fr; }
  .tb-title .ko { font-size: 2.2rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.trk-mini { width: 38px; height: 38px; min-height: 38px; padding: 0; justify-content: center; border-radius: 50%; flex: none; margin: 4px 0 0; }
.sec-help { font-size: 0.86rem; color: var(--muted); margin: -4px 0 10px; max-width: 60ch; }
.act { gap: 3px; }
.act-k { font-family: var(--f-mono); font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
.act-d { font-size: 0.82rem; color: var(--ink); line-height: 1.35; opacity: 0.85; }
.act-s { margin-top: auto; padding-top: 4px; font-family: var(--f-mono); font-size: 0.72rem; }
.timecard { margin-top: 0; }
/* streak: red attendance stamp with day count + today's progress toward 10 */
.streak { display: inline-flex; align-items: center; gap: 5px; }
.stk-stamp { width: 36px; height: 36px; border: 2px solid #FF6A55; border-radius: 50%; display: grid; place-items: center; align-content: center; transform: rotate(-10deg); color: #FF6A55; line-height: 1; }
.stk-stamp.zero { border-color: #5B6A8E; color: #8C9AB8; }
.stk-ko { font-family: var(--f-ko); font-weight: 900; font-size: 0.56rem; }
.stk-n { font-family: var(--f-mono); font-weight: 700; font-size: 0.9rem; }
.stk-day { font-family: var(--f-mono); font-size: 0.72rem; color: #9FB0CF; font-variant-numeric: tabular-nums; }
.stk-day.done { color: var(--neon); font-weight: 700; }
.flash-ex { display: grid; gap: 2px; margin-top: 6px; padding-top: 8px; border-top: 1px dotted var(--line); }
.flash-back .flash-ex-ko { font-size: 1rem; font-weight: 500; }
.flash-ex-en { font-size: 0.82rem; color: var(--muted); }

/* ---------- L2 additions: arrow sentences, exercise hints, workbook comprehension ---------- */
.arrow { color: var(--accent); font-family: var(--f-ui); font-weight: 700; }
.exq-hint { margin: -4px 0 8px; font-size: 0.86rem; color: var(--muted); }
.exq-ko { font-size: 1.2rem; margin: 0 0 8px; }
.wbq-given { font-size: 1.12rem; margin: 2px 0 8px; line-height: 1.6; }
.wb-explain textarea { width: 100%; min-height: 84px; font: inherit; font-size: 1rem; padding: 9px 10px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); resize: vertical; }
.wb-explain textarea:focus { border-color: var(--accent); outline: none; }
.xp-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.xp-key { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 6px; padding: 10px 12px; margin-top: 8px; }
.xp-key .lbl { display: block; margin-bottom: 4px; }
.xp-mine { color: var(--muted); font-size: 0.92rem; margin: 6px 0 0; white-space: pre-wrap; }
/* L3: choice exercises in the textbook */
.ex-choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin: 8px 0; }
.ex-choices .opt { min-height: 44px; }
.ch-l { color: var(--muted, #888); font-family: 'IBM Plex Mono', monospace; margin-right: 4px; }
/* L3/L4 workbook: pictures, word bank, true/false, conjugation, sentence */

.wb-bank { margin: 8px 0 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.bank-line { margin: 4px 0; line-height: 2.1; }

.tf-row { display: flex; gap: 8px; margin: 8px 0; }
.tf-row .opt { flex: 1; text-align: center; min-height: 44px; }

.verb-tag { color: var(--muted); }
.bank-line .sp { display: inline; width: auto; min-width: 0; white-space: nowrap; position: static; }
.bank-line { padding-left: 0; }
.bank-line .sp { height: auto; padding: 1px 6px; margin-top: 0; font-family: inherit; }
/* touch: no double-tap zoom and no tap delay on anything you press or type into (iOS "stutter") */
button, input, select, textarea, .tile, .key, .opt, .mt { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.kbd, .key, .tile { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.key.down { background: var(--neon); }
/* ---------- lessons accordion (replaces the lesson dropdown) ---------- */
#ltail { max-width: 560px; margin: -40px auto 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body.in-round #ltail { display: none; }
.lhead { margin: 0 0 6px; }
.lacc { display: grid; gap: 6px; }
.lrow { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 10px; width: 100%; text-align: left;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 56px; scroll-margin-top: calc(var(--hdr-h) + 12px); }
.lrow:hover { border-color: var(--accent); }

#main[hidden] { display: none; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

/* workbook: multiple choice (L5) and "underline one or both" pairs (L6) */
.wb-mc .ex-choices { grid-template-columns: 1fr; }
.wb-mc .ex-choices .opt .ko { font-size: 1.15rem; }
.pk-grp { display: inline-flex; gap: 6px; margin: 2px 2px; vertical-align: middle; border-radius: 10px; padding: 2px; flex-wrap: wrap; }
.pk-grp.is-bad { box-shadow: 0 0 0 2px var(--bad); }
.pk-b.opt { min-height: 40px; padding: 6px 10px; font-size: 1.08rem; }

.pk-no { opacity: .55; }

/* L7/L8 workbook: word box for 'sentence', reading passage */
.wb-passage { background: var(--paper); color: var(--print); padding: 14px 16px; border-radius: 4px; margin: 6px 0 12px; box-shadow: 0 8px 16px -12px rgba(0,0,0,.45); }

.wb-passage u.wavy { text-decoration: underline wavy; text-decoration-color: var(--ramen); text-underline-offset: 5px; text-decoration-thickness: 1.5px; }
/* L9 conjugation chart */
.chart-cell { display: grid; grid-template-columns: 9.5em 1fr; align-items: center; gap: 8px; margin: 6px 0; }
.chart-cell .wb-cin { width: 100%; min-width: 0; font-size: 1.05rem; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.chart-cell .wb-cin.is-bad { border-color: var(--bad); background: var(--bad-bg); }
.chart-lbl { font-family: 'Noto Sans KR', sans-serif; font-size: .82rem; color: var(--muted); }
.chart-done { list-style: none; padding: 0; margin: 4px 0; }
.chart-done li { display: grid; grid-template-columns: 9.5em 1fr; gap: 8px; padding: 2px 0; }
.chart-mean { margin: 2px 0 4px; }
@media (max-width: 360px) { .chart-cell, .chart-done li { grid-template-columns: 1fr; gap: 2px; } }

/* L23 Word Builder: word list (tb.js wordsHtml) and pyramids (wb.js pyramidHtml) */
.wbld { margin: 8px 0 14px; border-top: 1px solid var(--line); }
.wbld-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.wbld-body { flex: 1; min-width: 0; }
.wbld-parts { margin: 0; color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }

.wbld-word .hanja { font-family: 'Noto Sans KR', serif; color: var(--muted); font-size: .95rem; margin-left: 4px; }
.wbld-en { margin: 0; font-weight: 600; }
.pyr { display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 10px 0 4px; }

.pyr-c { flex: 1 1 0; min-width: 0; text-align: center; font-size: 1.05rem; padding: 8px 4px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font-family: var(--f-ko); }
.pyr-top { background: var(--tag); color: var(--print); border-color: var(--tag); font-weight: 700; flex: 0 0 auto; padding: 8px 18px; }

.pyr-c.is-bad { border-color: var(--bad); background: var(--bad-bg); }
.pyr-c.is-ok { border-color: var(--ok); background: var(--ok-bg); }
.pyr-lbl { font-size: .78rem; color: var(--muted); margin: 0 0 -2px; font-family: var(--f-mono); }
.pyr-mean { margin: 6px 0 0; font-size: .92rem; }
.pyr-mean .ko { font-weight: 600; }
/* L30 vocabulary web (wb.js webHtml) */
.web-center { margin: 10px auto 8px; width: max-content; padding: 8px 18px; border-radius: 999px; background: #C13823; color: #fff; font-weight: 700; font-size: 1.15rem; }
.web { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 12px; }
.web-cat { border: 1.5px solid var(--line); border-radius: 10px; padding: 8px; background: var(--surface); min-width: 0; }
.web-h { margin: 0 0 6px; font-size: .9rem; } .web-h .ko { font-weight: 700; font-size: 1.05rem; }
.web-slots { display: flex; flex-wrap: wrap; gap: 4px; }
.web-slot { display: inline-block; width: 52px; height: 28px; border: 1.5px dashed var(--line); border-radius: 6px; }

.web-opts { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 200px; }
.web-b { flex: 1 1 0; min-width: 52px; min-height: 40px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 1rem; touch-action: manipulation; }
.web-b.sel { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.web-row.is-bad .web-w { color: var(--bad); } .web-row.is-bad .web-b.sel { background: var(--bad); border-color: var(--bad); }
.web-row.is-ok .web-w { color: var(--ok); }

/* ---------- L31: Level 3 review, Final Exam, certificate ---------- */
.pl-switch { display: flex; gap: 4px; margin: 0 0 6px; flex-wrap: wrap; width: 100%; }
.player:has(.pl-switch) { flex-wrap: wrap; }
.pl-switch button { flex: 1; min-width: 0; background: transparent; border: 1px solid #3A4668; color: #F4F7F2; border-radius: 4px; padding: 4px 6px; font-family: var(--f-mono); font-size: 0.74rem; min-height: 30px; }

.cert { position: relative; }
.cert-name { font-family: var(--f-display); font-size: 2rem; text-align: center; margin: 10px 0 0; color: var(--print); }
.cert-sub { text-align: center; margin: 0 0 8px; font-family: var(--f-mono); font-size: 0.8rem; color: #555; }

.floor.all-lit .fl-wall { stroke: var(--neon); filter: drop-shadow(0 0 4px var(--neon)); }
.dialogue .sent .sp { white-space: nowrap; min-width: 2.4em; }
/* voices in the game part (▶ after a line) */
.vtrk { width: 30px; height: 30px; min-height: 30px; margin: 0 0 0 6px; vertical-align: middle; display: inline-flex; align-items: center; font-size: 0.7rem; }
/* Loyalty Cards: speaker icon on the card */
.vic { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; margin-left: 6px; vertical-align: middle; border-radius: 50%; color: var(--muted); opacity: 0.7; cursor: pointer; }
.nw { white-space: nowrap; }
.vic:hover, .vic:focus-visible { opacity: 1; color: var(--accent); }

.flash-ex-ko .vic svg { width: 15px; height: 15px; }
/* readings: one button for the whole text, the line being read is marked */
.r-all { margin: 0 0 12px; }
.rline.speaking, .board-h.speaking { box-shadow: -3px 0 0 var(--accent); }
.board .rline.speaking { background: rgba(10, 138, 104, 0.10); }
/* counter: everything that is not a lesson activity sits in one collapsible block */
.extras { margin-top: 26px; border: 1.5px dashed var(--line); border-radius: 10px; padding: 0 14px; background: var(--surface); }
.extras[open] { padding-bottom: 14px; }

.extras-sum::-webkit-details-marker { display: none; }
.extras-sum::after { content: '▸'; position: absolute; right: 0; top: 12px; color: var(--muted); transition: transform 0.2s; }
.extras[open] .extras-sum::after { transform: rotate(90deg); }

.extras-tag { font-family: var(--f-mono); font-size: 0.68rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }
.extras-d { font-size: 0.84rem; color: var(--muted); }
.extras > .sec-h:first-of-type { margin-top: 6px; }
#xtail { max-width: 560px; margin: 0 auto 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body.in-round #xtail { display: none; }
#xtail .extras { margin-top: 0; }

/* ---------- Mnemo Hooks (src/mnemo.js; replaced the Loyalty Cards 2026-11-15) ---------- */

.mh-filt select { margin-left: 6px; min-height: 36px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); padding: 4px 6px; }
.mh-list { display: grid; gap: 6px; }
.mh-w { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }

.mh-w[open] summary { border-bottom: 1px dashed var(--line); }
.mh-lvl { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted); } .mh-lvl.l { background: #E0B23A; border-color: #B98A00; } .mh-lvl.k { background: var(--ok); border-color: var(--ok); }

.mh-pos, .mh-or { font-family: var(--f-mono); font-size: 0.7rem; border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; color: var(--muted); }

.mh-hook { background: var(--ok-bg); border-left: 3px solid var(--ok); border-radius: 4px; padding: 8px 10px; line-height: 1.45; }
.mh-hook i { display: block; font-style: normal; font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ok); margin-bottom: 2px; }

.mh-root { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; } .mh-root.big { padding: 8px 0; border-bottom: 1px dashed var(--line); }
.mh-hz { font-size: 1.5rem; font-family: 'Noto Serif TC', 'Noto Serif CJK TC', serif; } .mh-root.big .mh-hz { font-size: 2rem; }

.mh-again { border-color: var(--bad); } .mh-again b { color: var(--bad); } .mh-hard { border-color: #B98A00; } .mh-hard b { color: #B98A00; }

<script>
/* core.js — namespace, utilities, grading, state, saving, rewards, SRS.
   No Korean sentences live here: all language content is in the lesson data files. */
'use strict';
const MM = window.MM = {
  lessons: {}, forms: {}, textbook: {}, workbook: {}, game: {}, cards: {}, reads: {}, mnemo: {}, mnRoots: {},
  audio: {}, cast: {}, world: {}, upgrades: [],
};
MM.INTERVALS = [1, 2, 4, 7, 14, 30, 60];
MM.DAILY_GOAL = 10;

/* ---------- small utilities ---------- */
const U = MM.U = {
  esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
  shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  pick(a) { return a[Math.floor(Math.random() * a.length)]; },
  today(d = new Date()) { const z = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); },
  addDays(iso, n) { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return U.today(d); },
  daysBetween(a, b) { return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5); },
  won(n) { return '₩' + Math.round(n).toLocaleString('en-US'); },
  fmtTime(s) { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); },
  $(sel, root = document) { return root.querySelector(sel); },
  $$(sel, root = document) { return Array.from(root.querySelectorAll(sel)); },
  uid() { return Math.random().toString(36).slice(2, 9); },
  isHangul(ch) { const c = ch.charCodeAt(0); return (c >= 0xAC00 && c <= 0xD7A3) || (c >= 0x3131 && c <= 0x318E); },
};

/* ---------- voices (game part): file id = FNV-1a 32 of UTF-8 "voice|text" → MM.voiceMap (clip of audio/voice/l<N>.mp3) ----------
   vNorm: NFC, {form|lemma} → form, trim. tools/voice_extract.js uses these same functions. */
MM.vNorm = s => String(s ?? '').normalize('NFC').replace(/\{([^|}]+)\|[^}]+\}/g, '$1').trim();
MM.voiceId = (voice, text) => {
  const b = new TextEncoder().encode(voice + '|' + MM.vNorm(text)); let h = 0x811c9dc5;
  for (const x of b) { h ^= x; h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16).padStart(8, '0');
};
/* who speaks with which voice: M = male, F = female. The player ('you') alternates by story: shifts A/B/C (and the staff chat)
   take turns with the lesson number, so neighbouring stories differ; MM.YOU_FIX pins a story where the text implies a gender. */
MM.YOU_FIX = { '8.A': 'M' };   // L8 A6: Mr. Kim says 학생은 우리 손자 같아요 (“you’re like my grandson”)
MM.youVoice = (n, key) => MM.YOU_FIX[n + '.' + key] || (((+n) + ({ A: 0, B: 1, C: 2, chat: 3 }[key] || 0)) % 2 ? 'F' : 'M');
MM.VOICE_OF = { boss: 'M', taxi: 'M', manager: 'M', courier: 'M', police: 'M', minji: 'F', sua: 'F', grandma: 'F', hq: 'F', board: 'F', card: 'F' };

/* ---------- Hangul helpers ---------- */
const HG = MM.HG = (() => {
  const L = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'.split('');
  const V = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ'.split('');
  const T = [''].concat('ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ'.split(''));
  function jamo(str) {
    let out = '';
    for (const ch of str) {
      const c = ch.charCodeAt(0) - 0xAC00;
      if (c >= 0 && c < 11172) out += L[Math.floor(c / 588)] + V[Math.floor((c % 588) / 28)] + T[c % 28];
      else out += ch;
    }
    return out;
  }
  return { L, V, T, jamo, syllables: s => Array.from(s.replace(/\s+/g, '')) };
})();

/* ---------- answer patterns & grading ---------- */
// "(a|b|)c" -> ["ac","bc","c"]; nested groups are not supported (keep data flat).
MM.expand = function expand(p) {
  const m = p.match(/\(([^()]*)\)/);
  if (!m) return [p];
  const out = [];
  for (const alt of m[1].split('|')) for (const rest of expand(p.slice(0, m.index) + alt + p.slice(m.index + m[0].length))) out.push(rest);
  return out;
};
MM.norm = s => String(s || '').normalize('NFC')
  .replace(/[“”"'‘’`]/g, '')
  .replace(/[.!?~…,·]+/g, ' ')
  .replace(/\s+/g, ' ').trim();
const nospace = s => s.replace(/\s+/g, '');
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
MM.lev = lev;
/* q: {ans:[patterns], soft:[{p, note}], diag:[{p, note}], order:false, lenient:false}
   returns {ok, kind, note, expected} */
MM.grade = function grade(input, q) {
  const expected = MM.expand(q.ans[0])[0];
  const raw = String(input || '');
  const s = MM.norm(raw);
  if (!s) return { ok: false, kind: 'empty', note: 'Type an answer first.', expected };
  if (/[A-Za-z]/.test(s)) return { ok: false, kind: 'latin', note: 'Write it in Hangul. Romanization is not accepted here.', expected };
  const acc = q.ans.flatMap(MM.expand).map(MM.norm);
  if (acc.includes(s)) return { ok: true, kind: 'exact', expected };
  if (acc.some(a => nospace(a) === nospace(s))) return { ok: true, kind: 'space', note: 'Accepted. Watch the spacing (띄어쓰기): ' + acc.find(a => nospace(a) === nospace(s)), expected };
  for (const so of (q.soft || [])) if (MM.expand(so.p).map(MM.norm).some(a => nospace(a) === nospace(s))) return { ok: true, kind: 'soft', note: so.note, expected };
  if (q.order !== false) {
    const key = x => x.split(' ').sort().join(' ');
    const last = x => x.split(' ').pop();
    // the predicate must stay at the end; only the words before it may move
    const hit = acc.find(a => a.includes(' ') && key(a) === key(s) && last(a) === last(s));
    if (hit) return { ok: true, kind: 'order', note: 'Accepted with a different word order. The book has: ' + hit, expected };
  }
  for (const d of (q.diag || [])) {
    const hit = (d.p && MM.expand(d.p).map(MM.norm).some(a => nospace(a) === nospace(s))) || (d.re && new RegExp(d.re).test(s)); // L27: a diag may be a regex only
    if (hit) return { ok: false, kind: 'diag', note: d.note, expected };
  }
  if (q.lenient !== false) {
    // one jamo off, but never inside the last two syllables (that is where the grammar lives)
    for (const a of acc) {
      const A = nospace(a), S = nospace(s);
      if (A.length < 4 || Math.abs(A.length - S.length) > 1) continue;
      const tailA = A.slice(-2), tailS = S.slice(-2);
      if (tailA !== tailS) continue;
      if (lev(HG.jamo(A), HG.jamo(S)) === 1) return { ok: true, kind: 'lenient', note: 'Accepted as a typo. Correct spelling: ' + a, expected };
    }
  }
  return { ok: false, kind: 'wrong', expected };
};

/* syllable diff for dictation: returns html marking missing/extra syllables */
MM.diffHtml = function diffHtml(user, target) {
  const a = Array.from(MM.norm(user)), b = Array.from(MM.norm(target));
  const m = a.length, n = b.length, dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  let i = 0, j = 0, out = '';
  while (i < m || j < n) {
    if (i < m && j < n && a[i] === b[j]) { out += U.esc(b[j]); i++; j++; }
    else if (j < n && (i >= m || dp[i][j + 1] >= dp[i + 1][j])) { out += '<ins>' + (b[j] === ' ' ? '␣' : U.esc(b[j])) + '</ins>'; j++; }
    else { out += '<del>' + (a[i] === ' ' ? '␣' : U.esc(a[i])) + '</del>'; i++; }
  }
  return out;
};

/* ---------- state ---------- */
MM.defaultState = () => ({
  v: 1, t: 0, theme: null, kbd: 'screen', won: 0,
  cur: { lesson: 1, tab: 'tb', closed: true },   // a new visitor sees every lesson collapsed
  L: {},            // per lesson: {tb:{g:{},ex:{},mode}, wb:{i:{}}, game:{shifts:{}, reads:{}}}
  skills: {},       // id -> {lvl, due, c, w}
  mistakes: [],     // {skill, qid, lesson, n}
  days: {},         // iso -> correct answers that day
  coll: [],         // collected item ids
  cards: {},        // (old Loyalty Cards, replaced by Mnemo Hooks on 2026-11-15; kept so old codes still load)
  mh: { c: {} },    // Mnemo Hooks SRS: key -> [due day, interval, ease×100, reps, lapses]; keys <card id>:r|p|l, R:<root id>
  fixed: [],        // store upgrades done
  vq: {},           // vocab rotation queue per lesson
});
MM.S = MM.defaultState();
MM.LS = (n) => { const S = MM.S; S.L[n] = S.L[n] || {}; const L = S.L[n]; L.tb = L.tb || { g: {}, ex: {} }; L.wb = L.wb || { i: {} }; L.game = L.game || { shifts: {}, reads: {} }; return L; };

const LS_KEY = 'moonlight-mart-v1';
let dbDoc = null, saveTimer = null, dbWarned = false;
/* S.t = time of the last real change. saveNow() is only called when something changed (MM.save() pending, import,
   erase), so an older state on another device can never get a newer stamp just by being opened and closed. */
MM.saveNow = function () {
  clearTimeout(saveTimer); saveTimer = null;
  MM.S.t = Date.now();
  const json = JSON.stringify(MM.S);
  try { localStorage.setItem(LS_KEY, json); } catch (e) { /* storage blocked: db only */ }
  if (dbDoc) dbWrite(JSON.parse(json), 0);
  if (MM.sync) MM.sync.changed();   // sync.js: note what changed, upload soon
};
/* sync.js after a merge: write the merged progress without counting it as a change of this device */
MM.writeLocal = function () { MM.S.t = Date.now(); localStorage.setItem(LS_KEY, JSON.stringify(MM.S)); };
/* account save: one retry for a transient error; anything else (document too large, quota) is shown once */
function dbWrite(obj, tries) {
  const doc = dbDoc;
  doc.set(obj).then(() => { dbWarned = false; }).catch(err => {
    const code = err && err.code;
    if (code === 'unavailable' && tries < 1) return setTimeout(() => { if (dbDoc === doc) dbWrite(obj, tries + 1); }, 800 + Math.random() * 1200);
    console.warn('save failed', code);
    if (!dbWarned && MM.ui && MM.ui.toast) { dbWarned = true; MM.ui.toast(code === 'invalid_argument' || code === 'quota_exceeded' ? 'Your account is full: progress is saved in this browser only. Get a transfer code to keep it safe.' : 'Could not save to your account just now. Progress is kept in this browser.'); }
  });
}
MM.save = function () { if (saveTimer) clearTimeout(saveTimer); saveTimer = setTimeout(MM.saveNow, 900); };
MM.savePending = () => !!saveTimer;
/* Mnemo Hooks card ids were renamed on 2026-11-17 (old prefix → ko-k3-, same numbers): progress saved before keeps its cards */
MM.oldCardId = k => typeof k === 'string' && /^ko-[a-z]+3-/.test(k) && !k.startsWith('ko-k3-') ? 'ko-k3-' + k.replace(/^ko-[a-z]+3-/, '') : k;
MM.fixIds = function (S) {
  const c = S && S.mh && S.mh.c;
  if (c && typeof c === 'object') for (const k of Object.keys(c)) { const n = MM.oldCardId(k); if (n !== k) { if (!(n in c)) c[n] = c[k]; delete c[k]; } }
  return S;
};
MM.loadLocal = function () {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) MM.S = MM.fixIds(Object.assign(MM.defaultState(), JSON.parse(raw))); } catch (e) { }
  MM.bootT = MM.S.t || 0;
};
/* account vs this browser: the newer LAST CHANGE wins. Compared with the stamp this browser had when the page opened
   (MM.bootT), so changes made while the account was still loading do not make an old state look new. */
MM.connectDb = async function (onRemote) {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const doc = db.doc('data/users/' + id + '/moonlight-mart');
    const snap = await doc.get();
    dbDoc = doc;
    if (snap.exists) {
      const remote = snap.data(), rt = remote.t || 0;
      if (rt > (MM.bootT || 0)) { clearTimeout(saveTimer); saveTimer = null; MM.S = MM.fixIds(Object.assign(MM.defaultState(), JSON.parse(JSON.stringify(remote)))); try { localStorage.setItem(LS_KEY, JSON.stringify(MM.S)); } catch (e) { } onRemote && onRemote(); }
      else if (rt < (MM.S.t || 0)) MM.saveNow();
    } else if (MM.S.t) MM.saveNow();
    MM.dbOk = true;
  } catch (e) { console.warn('db unavailable', e && e.code); }
};
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveTimer) MM.saveNow(); });

/* ---------- transfer code: MM3- + base64url(deflate-raw(JSON)) ---------- */
MM.exportCode = async function () {
  const bytes = new TextEncoder().encode(JSON.stringify(MM.S));
  const cs = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
  const buf = new Uint8Array(await new Response(cs).arrayBuffer());
  let bin = ''; for (const b of buf) bin += String.fromCharCode(b);
  return 'MM3-' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
};
MM.importCode = async function (code) {
  code = String(code || '').trim();
  if (!code.startsWith('MM3-')) throw new Error('The code should start with MM3-.');
  let b64 = code.slice(4).replace(/\s+/g, '').replace(/-/g, '+').replace(/_/g, '/');
  while (b64.length % 4) b64 += '=';
  let obj;
  try {
    const bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    obj = JSON.parse(await new Response(ds).text());
  } catch (e) { throw new Error('The code is incomplete or damaged. Copy the whole code again (it is long).'); }
  if (!obj || obj.v !== 1) throw new Error('This code is from a different app version.');
  return MM.fixIds(Object.assign(MM.defaultState(), obj));
};

/* ---------- Korean date (header) ---------- */
/* Sino-Korean number 1–9999 in Hangul: 일 is dropped before 십/백/천 (십, 백, 천; 2026 → 이천이십육) */
MM.sinoKo = function (n) {
  const D = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'], U = [[1000, '천'], [100, '백'], [10, '십']];
  let out = '';
  for (const [v, u] of U) { const k = Math.floor(n / v) % 10; if (k) out += (k === 1 ? '' : D[k]) + u; }
  return out + D[n % 10];
};
MM.KO_WD = ['일', '월', '화', '수', '목', '금', '토'];
/* short: 10월 23일 (금) · full (spoken, in words): 이천이십육 년 시월 이십삼 일 금요일 (6월 유월, 10월 시월) */
MM.koDate = function (d = new Date()) {
  const y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate(), wd = MM.KO_WD[d.getDay()];
  const mon = m === 6 ? '유' : m === 10 ? '시' : MM.sinoKo(m);
  return { short: `${m}월 ${day}일 (${wd})`, full: `${MM.sinoKo(y)} 년 ${mon}월 ${MM.sinoKo(day)} 일 ${wd}요일` };
};

/* ---------- skills, rewards, SRS, attendance ---------- */
MM.skill = id => (MM.S.skills[id] = MM.S.skills[id] || { lvl: 0, due: null, c: 0, w: 0 });
MM.isWeak = id => { const s = MM.S.skills[id]; return !!s && s.w >= 2 && s.c / (s.c + s.w) < 0.7; };
MM.bonusPct = () => MM.upgrades.filter(u => MM.S.fixed.includes(u.id) && u.bonus === 'won10').length * 10;
MM.hasPerk = perk => MM.upgrades.some(u => MM.S.fixed.includes(u.id) && u.bonus === perk);
MM.perkCount = perk => MM.upgrades.filter(u => MM.S.fixed.includes(u.id) && u.bonus === perk).length;
/* call once per answered question; returns ₩ earned */
MM.record = function (q, ok, opts = {}) {
  const S = MM.S, day = U.today();
  let earned = 0;
  if (q.skill && MM.tallyAdd) MM.tallyAdd(q.skill, ok);
  if (q.skill) {
    const sk = MM.skill(q.skill);
    if (ok) sk.c++; else sk.w++;
  }
  if (ok) {
    S.days[day] = (S.days[day] || 0) + 1;
    let base = opts.base ?? 100;
    if (q.skill && MM.isWeak(q.skill)) base *= 2;
    if (opts.typed) base *= 1.5;
    base *= 1 + MM.bonusPct() / 100;
    earned = Math.round(base / 10) * 10;
    S.won += earned;
    // answered a returned mistake correctly -> retire one entry for that skill
    if (opts.review) { const i = S.mistakes.findIndex(m => m.skill === q.skill); if (i >= 0) S.mistakes.splice(i, 1); }
  } else if (q.skill && !opts.noMistake) {
    const m = S.mistakes.find(m => m.qid === q.id);
    if (m) m.n++; else S.mistakes.push({ skill: q.skill, qid: q.id, lesson: q.lesson || S.cur.lesson, n: 1 });
    if (S.mistakes.length > 80) S.mistakes.shift();
  }
  MM.save();
  return earned;
};
/* at the end of a round: tally {skill:{c,w}} -> move the skill along the interval ladder */
MM.srsUpdate = function (tally) {
  const day = U.today();
  for (const [id, t] of Object.entries(tally)) {
    const sk = MM.skill(id);
    const acc = t.c / Math.max(1, t.c + t.w);
    if (acc >= 0.8) { if (!sk.due || sk.due <= day) sk.lvl = Math.min(sk.lvl + 1, MM.INTERVALS.length - 1); }
    else sk.lvl = Math.max(0, sk.lvl - 1);
    sk.due = U.addDays(day, acc >= 0.8 ? MM.INTERVALS[sk.lvl] : 1);
  }
  MM.save();
};
MM.dueSkills = () => { const d = U.today(); return Object.entries(MM.S.skills).filter(([, s]) => s.due && s.due <= d).map(([id]) => id); };
MM.streak = function () {
  let n = 0, d = U.today();
  if ((MM.S.days[d] || 0) < MM.DAILY_GOAL) d = U.addDays(d, -1);
  while ((MM.S.days[d] || 0) >= MM.DAILY_GOAL) { n++; d = U.addDays(d, -1); }
  return n;
};
</script>
<script>
/* keyboard.js — on-screen 2-beolsik Korean keyboard with syllable composition.
   Any <input class="kin"> or <textarea class="kin"> gets it. Backspace removes one jamo
   while a syllable is being composed. "System keyboard" switches the fields back to the
   device's own keyboard (S.kbd = 'system'). */
'use strict';
(function () {
  const { L, V, T } = MM.HG;
  const CV = { 'ㅗㅏ': 'ㅘ', 'ㅗㅐ': 'ㅙ', 'ㅗㅣ': 'ㅚ', 'ㅜㅓ': 'ㅝ', 'ㅜㅔ': 'ㅞ', 'ㅜㅣ': 'ㅟ', 'ㅡㅣ': 'ㅢ' };
  const CT = { 'ㄱㅅ': 'ㄳ', 'ㄴㅈ': 'ㄵ', 'ㄴㅎ': 'ㄶ', 'ㄹㄱ': 'ㄺ', 'ㄹㅁ': 'ㄻ', 'ㄹㅂ': 'ㄼ', 'ㄹㅅ': 'ㄽ', 'ㄹㅌ': 'ㄾ', 'ㄹㅍ': 'ㄿ', 'ㄹㅎ': 'ㅀ', 'ㅂㅅ': 'ㅄ' };
  const isV = j => V.includes(j);
  const syl = (l, v, t) => String.fromCharCode(0xAC00 + (L.indexOf(l) * 21 + V.indexOf(v)) * 28 + T.indexOf(t || ''));

  /* compose a keystroke sequence into text */
  function compose(keys) {
    let out = '', l = null, v = null, v1 = null, t1 = null, t2 = null;
    const flush = () => {
      if (l && v) out += syl(l, v, t2 ? CT[t1 + t2] : t1);
      else if (l) out += l;
      else if (v) out += v;
      l = v = v1 = t1 = t2 = null;
    };

/* L31 (final chapter, Level 3 Review): three long recordings in one player (switcher). The same files serve the clips:
   tb.dlg = dialogue (per-line clips), tb.voc = vocabulary (per word: three readings), tb.gram = grammar (per answer);
   wb.dlg = dialogue for the Final Exam dictation. */

    { src: 'audio/l31/vocab.mp3', title: 'Level 3 Review – Vocabulary (12:42)', short: 'Vocabulary' },
    { src: 'audio/l31/grammar.mp3', title: 'Level 3 Review – Grammar (11:45)', short: 'Grammar' },
  ],
  tb: { dlg: 'audio/l31/dialogue.mp3', voc: 'audio/l31/vocab.mp3', gram: 'audio/l31/grammar.mp3' },
